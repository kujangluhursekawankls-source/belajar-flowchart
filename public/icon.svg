<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#grad)" stroke-width="6" opacity="0.4" />
  <g filter="url(#shadow)" transform="translate(48, 56)">
    <!-- Flowchart nodes & arrows -->
    <!-- Start Node (Terminator) -->
    <rect x="146" y="20" width="124" height="48" rx="24" fill="#10b981" />
    <text x="208" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">MULAI</text>
    
    <!-- Connector 1 -->
    <line x1="208" y1="68" x2="208" y2="108" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <polygon points="208,114 202,102 214,102" fill="#94a3b8" />
    
    <!-- Decision Node (Diamond) -->
    <polygon points="208,124 288,184 208,244 128,184" fill="#f59e0b" />
    <text x="208" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ONLINE?</text>
    <text x="208" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">Status Jaringan</text>
    
    <!-- Branch YA (Down to Fetch Process) -->
    <line x1="208" y1="244" x2="208" y2="284" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <polygon points="208,290 202,278 214,278" fill="#10b981" />
    <rect x="214" y="254" width="28" height="18" rx="4" fill="#10b981" />
    <text x="228" y="267" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">YA</text>
    
    <!-- Process Node (Rectangle) -->
    <rect x="138" y="290" width="140" height="52" rx="10" fill="#3b82f6" />
    <text x="208" y="322" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Network Fetch</text>
    
    <!-- Branch TIDAK (Right to Cache Fallback) -->
    <path d="M 288,184 L 350,184 L 350,290" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="350,296 344,284 356,284" fill="#ef4444" />
    <rect x="300" y="165" width="40" height="18" rx="4" fill="#ef4444" />
    <text x="320" y="178" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">TIDAK</text>
    
    <!-- Process Node: Cache Storage -->
    <rect x="290" y="296" width="120" height="52" rx="10" fill="#8b5cf6" />
    <text x="350" y="322" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Cache Storage</text>
    
    <!-- Bottom converge line to End -->
    <line x1="208" y1="342" x2="208" y2="370" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="350" y1="348" x2="350" y2="370" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="208" y1="370" x2="350" y2="370" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="279" y1="370" x2="279" y2="388" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <polygon points="279,394 273,382 285,382" fill="#94a3b8" />
    
    <!-- End Node -->
    <rect x="204" y="394" width="150" height="46" rx="23" fill="#06b6d4" />
    <text x="279" y="423" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SELESAI (STANDBY)</text>
  </g>
</svg>
